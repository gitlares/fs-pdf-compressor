name: fs-pdf-compressor
title: FS PDF Compressor
version: "1.0.15"
summary: Fast and simple local PDF compression
description: |
  Compress PDF files locally with Ghostscript. Drag in one or more PDFs (or a
  folder), choose a compression profile, and files are replaced only when the
  result is smaller. No uploads, accounts, analytics, or telemetry.
base: core24
grade: stable
confinement: strict
license: AGPL-3.0-or-later
contact:
  - https://github.com/gitlares/fs-pdf-compressor
issues:
  - https://github.com/gitlares/fs-pdf-compressor/issues
website: https://gitlares.github.io/fs-pdf-compressor/
source-code: https://github.com/gitlares/fs-pdf-compressor
icon: assets/PDFCompresor.png
# Expose Ghostscript's bundled support files and fonts inside the Snap mount
# namespace, never the host. Ghostscript 10.08.0 compiles its initialization
# resources into the executable and still installs auxiliary files under lib.
layout:
  /usr/share/ghostscript:
    bind: $SNAP/usr/share/ghostscript
  /usr/share/fonts:
    bind: $SNAP/usr/share/fonts
  /usr/share/color/icc/ghostscript:
    bind: $SNAP/usr/share/color/icc/ghostscript
platforms:
  amd64:

apps:
  fs-pdf-compressor:
    command: bin/fs-pdf-compressor
    desktop: usr/share/applications/fs-pdf-compressor.desktop
    plugs:
      - desktop
      - desktop-legacy
      - home
      - opengl
      - removable-media
      - wayland
      - x11

parts:
  ghostscript:
    plugin: autotools
    source: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/ghostscript-10.08.0.tar.xz
    source-checksum: sha256/c20492bc8ebb96c87fa2e52a0926e1cda8cde95d66145e018ac713fed5da38cf
    autotools-configure-parameters:
      - --prefix=/usr
  fs-pdf-compressor:
    plugin: nil
    source: .
    source-type: local
    after:
      - ghostscript
    build-packages:
      - python3-pip
    stage-packages:
      - libdbus-1-3
      - libegl1
      - libfontconfig1
      - libfreetype6
      - libjpeg-turbo8
      - liblcms2-2
      - libgl1
      - libglib2.0-0
      - libice6
      - libopengl0
      - libopenjp2-7
      - libpng16-16t64
      - libsm6
      - libtiff6
      - libwayland-cursor0
      - libwayland-egl1
      - libwayland-server0
      - libx11-xcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xfixes0
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxrender1
      - python3-minimal
      - python3.12-minimal
    override-build: |
      set -eu
      source_version="$(python3 -c 'from fs_pdf_compressor.version import APP_VERSION; print(APP_VERSION)')"
      test "$source_version" = "$CRAFT_PROJECT_VERSION"
      app_root="$CRAFT_PART_INSTALL/opt/fs-pdf-compressor"
      mkdir -p "$app_root/python" "$CRAFT_PART_INSTALL/bin"
      python3 -m pip install --no-compile --target "$app_root/python" \
        -r snap/requirements.txt
      # This application uses Qt Widgets only. Removing unused QML modules
      # avoids shipping their optional multimedia and compositor plugins.
      rm -rf "$app_root/python/PySide6/Qt/qml"
      cp linux_app.py "$app_root/"
      cp -a fs_pdf_compressor assets "$app_root/"
      install -Dm0644 LICENSE "$app_root/licenses/FS-PDF-Compressor-AGPL-3.0.txt"
      install -Dm0644 THIRD_PARTY_NOTICES.md "$app_root/licenses/THIRD_PARTY_NOTICES.md"
      test -f "$CRAFT_STAGE/usr/bin/gs"
      test -d "$CRAFT_STAGE/usr/share/ghostscript/10.08.0/lib"
      printf '%s\n' "$CRAFT_PROJECT_VERSION" > "$app_root/VERSION"
      install -Dm0755 snap/fs-pdf-compressor "$CRAFT_PART_INSTALL/bin/fs-pdf-compressor"
      install -Dm0644 snap/gui/fs-pdf-compressor.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/fs-pdf-compressor.desktop"
