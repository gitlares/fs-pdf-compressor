name: Build macOS 14 Apple Silicon candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching the checked-out source
        required: true
        default: "1.0.15"

permissions:
  contents: read

jobs:
  assemble:
    runs-on: macos-14
    env:
      APP_VERSION: ${{ inputs.version }}
      SOURCE_REF: ${{ github.sha }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      MACOS_MINIMUM_VERSION: "14.0"
      FS_COMPRESSOR_BUILD_STAGE: assemble
      DIST_DIR: ci-build
    steps:
      - uses: actions/checkout@v4
      - name: Install Apple Silicon dependencies
        run: |
          brew install python@3.12 ghostscript
          python3.12 -m venv .build-venv
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/python -m pip install -r requirements-build.txt
      - name: Build pinned Ghostscript 10.08.0
        run: |
          archive="$RUNNER_TEMP/ghostscript-10.08.0.tar.xz"
          source_dir="$RUNNER_TEMP/ghostscript-10.08.0"
          prefix="$RUNNER_TEMP/ghostscript-10.08.0-install"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/ghostscript-10.08.0.tar.xz
          echo "c20492bc8ebb96c87fa2e52a0926e1cda8cde95d66145e018ac713fed5da38cf  $archive" | shasum -a 256 --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          cd "$source_dir"
          ./configure --prefix="$prefix" --disable-cups --disable-fontconfig --without-x
          make -j "$(sysctl -n hw.ncpu)"
          make install
          cp COPYING "$prefix/LICENSE"
          test "$("$prefix/bin/gs" --version)" = "10.08.0"
          echo "GHOSTSCRIPT_ROOT=$prefix" >> "$GITHUB_ENV"
      - name: Assemble unsigned candidate
        run: |
          .build-venv/bin/python build_macos.py
      - name: Audit every bundled Mach-O target
        run: scripts/audit_macos_target.py --maximum 14.0 "ci-build/FS PDF Compressor.app"
      - name: Archive candidate without changing macOS links
        run: |
          tar -czf "ci-build/fs-pdf-compressor-${{ inputs.version }}-macos14-arm64-unsigned.tar.gz" \
            -C ci-build "FS PDF Compressor.app"
      - name: Upload unsigned compatibility candidate
        uses: actions/upload-artifact@v4
        with:
          name: fs-pdf-compressor-${{ inputs.version }}-macos14-arm64-unsigned
          path: ci-build/fs-pdf-compressor-${{ inputs.version }}-macos14-arm64-unsigned.tar.gz
          if-no-files-found: error
